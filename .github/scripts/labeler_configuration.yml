build:
  - changed-files:
    - any-glob-to-any-file: [ Cargo.toml, Cargo.lock, build.rs, deps.txt, src/deps_build.rs, src/xtask/** ]

ci:
  - changed-files:
    - any-glob-to-any-file: [ .github/actions/**, .github/workflows/**, .github/scripts/** ]

clipboard:
  - changed-files:
    - any-glob-to-any-file: [ runtime/autoload/provider/clipboard.vim ]

column:
  - changed-files:
    - any-glob-to-any-file: [ src/nvim/sign* ]

comment:
  - changed-files:
    - any-glob-to-any-file: [ runtime/lua/vim/_comment.lua ]

defaults:
  - changed-files:
    - any-glob-to-any-file: [ runtime/lua/vim/_core/defaults.lua ]

diagnostic:
  - changed-files:
    - any-glob-to-any-file: [ runtime/lua/vim/diagnostic.lua ]

diff:
  - changed-files:
    - any-glob-to-any-file: [ src/nvim/diff.rs, src/xdiff/** ]

documentation:
  - changed-files:
    - any-glob-to-all-files: [ runtime/doc/*, "**/*.md" ]

filetype:
  - changed-files:
    - any-glob-to-any-file: [ runtime/lua/vim/filetype.lua, runtime/lua/vim/filetype/detect.lua ]

filesystem:
  - changed-files:
    - any-glob-to-any-file: [ runtime/lua/vim/fs.lua ]

folds:
  - changed-files:
    - any-glob-to-any-file: [ src/nvim/fold* ]

image:
  - changed-files:
    - any-glob-to-any-file: [ '**/ui/img*' ]

lsp:
  - changed-files:
    - any-glob-to-any-file: [ runtime/lua/vim/lsp.lua, runtime/lua/vim/lsp/* ]

mouse:
  - changed-files:
    - any-glob-to-any-file: [ src/nvim/mouse* ]

multicursor:
  - changed-files:
    - any-glob-to-any-file: [ src/nvim/mcursor.rs, src/nvim/input_cmdatom*, runtime/lua/vim/_core/mcursor.lua ]

netrw:
  - changed-files:
    - any-glob-to-any-file: [ runtime/autoload/netrw.vim, runtime/plugin/netrwPlugin.vim ]

plugin-editorconfig:
  - changed-files:
    - any-glob-to-any-file: [ .editorconfig, runtime/lua/editorconfig.lua, runtime/plugin/editorconfig.lua ]

snippet:
  - changed-files:
    - any-glob-to-any-file: [ runtime/lua/vim/snippet.lua ]

spell:
  - changed-files:
    - any-glob-to-any-file: [ src/nvim/spell* ]

terminal:
  - changed-files:
    - any-glob-to-any-file: [ src/nvim/terminal.rs, src/nvim/vterm/** ]

test:
  - changed-files:
    - any-glob-to-all-files: [test/**/*]

treesitter:
  - changed-files:
    - any-glob-to-any-file: [ src/nvim/lua/treesitter.rs, runtime/lua/vim/treesitter.lua, runtime/lua/vim/treesitter/*, runtime/queries/**/* ]

tui:
  - changed-files:
    - any-glob-to-any-file: [ src/nvim/tui/** ]

ui2:
  - changed-files:
    - any-glob-to-any-file: [ "runtime/lua/vim/_core/ui2*" ]

ux-visibility:
  - changed-files:
    - any-glob-to-any-file: [ "**/health.lua" ]
