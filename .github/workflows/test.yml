name: test
on:
  push:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
  pull_request:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BIN_DIR: ${{ github.workspace }}/target/nvim-build/bin
  BUILD_DIR: ${{ github.workspace }}/target/nvim-build
  INSTALL_PREFIX: ${{ github.workspace }}/target/nvim-install
  LOG_DIR: ${{ github.workspace }}/target/nvim-build/log
  NVIM_LOG_FILE: ${{ github.workspace }}/target/nvim-build/nvim.log
  # TEST_FILE: test/functional/core/startup_spec.lua
  # TEST_FILTER: foo

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lua: ${{ steps.filter.outputs.lua }}
      errcodes: ${{ steps.filter.outputs.errcodes }}
      docs: ${{ steps.filter.outputs.docs }}
      rust: ${{ steps.filter.outputs.rust }}
      test: ${{ steps.filter.outputs.test }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            {
              echo "lua=true"
              echo "errcodes=true"
              echo "docs=true"
              echo "rust=true"
              echo "test=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          changed_files=$(git diff --name-only "$merge_base" "$HEAD_SHA")
          printf 'Changed files:\n%s\n' "$changed_files"

          run_lua=false
          run_errcodes=false
          run_docs=false
          run_rust=false
          run_test=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md|LICENSE.txt|*/LICENSE|*/LICENSE-*|*/COPYING|*/README|*/README.txt|\
              .editorconfig|.emmyrc.json|.git-blame-ignore-revs|.gitattributes|\
              .gitignore|.luarc.json|.mailmap|src/.valgrind.supp|\
              .github/ISSUE_TEMPLATE/*|.github/dependabot.yml|.github/benchmarks.svg|\
              .github/zizmor.yml|.github/workflows/zizmor.yml|.github/workflows/release.yml|\
              contrib/nvim.bash|contrib/zsh-completion.zsh)
                ;;
              .stylua.toml|.stylua2.toml|.styluaignore|contrib/*.lua)
                run_lua=true
                ;;
              runtime/doc/*)
                run_errcodes=true
                run_docs=true
                ;;
              src/gen/*|src/nvim/*.lua|runtime/lua/*|runtime/pack/*.lua)
                run_lua=true
                run_docs=true
                run_test=true
                ;;
              runtime/*.lua|test/*.lua)
                run_lua=true
                run_test=true
                ;;
              test/*.rs)
                run_rust=true
                run_test=true
                ;;
              runtime/*|test/*|src/man/*|src/nvim/po/*)
                run_test=true
                ;;
              src/nvim/api/private/*)
                run_errcodes=true
                run_rust=true
                run_test=true
                ;;
              src/nvim/api/*.rs)
                run_errcodes=true
                run_docs=true
                run_rust=true
                run_test=true
                ;;
              src/xtask/*)
                run_lua=true
                run_errcodes=true
                run_docs=true
                run_rust=true
                run_test=true
                ;;
              src/deps_build.rs)
                run_docs=true
                run_rust=true
                run_test=true
                ;;
              src/*.rs)
                run_errcodes=true
                run_rust=true
                run_test=true
                ;;
              *)
                run_lua=true
                run_errcodes=true
                run_docs=true
                run_rust=true
                run_test=true
                ;;
            esac
          done <<< "$changed_files"

          {
            echo "lua=$run_lua"
            echo "errcodes=$run_errcodes"
            echo "docs=$run_docs"
            echo "rust=$run_rust"
            echo "test=$run_test"
          } >> "$GITHUB_OUTPUT"

  lintrust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: lintrust
        run: cargo xtask lintrust

      - name: cargo test
        run: cargo xtask unittest

  lint:
    needs: changes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: ${{ github.event_name == 'pull_request' }}
        name: lintcommit
        run: cargo xtask lintcommit

      - if: needs.changes.outputs.errcodes == 'true'
        name: linterrcodes
        run: cargo xtask linterrcodes

      - if: needs.changes.outputs.lua == 'true'
        name: Install stylua
        run: |
          mkdir -p "$BIN_DIR"
          wget --directory-prefix="$BIN_DIR" https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-aarch64.zip
          (cd "$BIN_DIR"; unzip stylua*.zip)

      - if: needs.changes.outputs.lua == 'true'
        name: stylua
        env:
          CI_LINT: 1
        run: PATH="$BIN_DIR:$PATH" cargo xtask lintlua

      - if: needs.changes.outputs.docs == 'true'
        uses: ./.github/actions/setup

      - if: needs.changes.outputs.docs == 'true'
        name: Generate docs
        run: |
          cargo xtask doc
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Job failed, run 'cargo xtask doc' and commit your doc changes."
            git status --short
            git diff --color --exit-code
            exit 1
          fi

      - if: needs.changes.outputs.docs == 'true'
        name: lintdoc
        run: cargo xtask lintdoc

  posix:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    name: ${{ matrix.build.os }} ${{ matrix.build.flavor }} ${{ matrix.test }}
    strategy:
      fail-fast: false
      matrix:
        build:
          [
            { runner: ubuntu-24.04, os: ubuntu, flavor: debug, flags: "--debug" },
            { runner: ubuntu-24.04, os: ubuntu, flavor: release, flags: "--release" },
            { runner: ubuntu-24.04-arm, os: ubuntu, flavor: arm, flags: "--release" },
            { runner: macos-26, os: macos, flavor: arm, flags: "--release" },
            { runner: ubuntu-24.04, os: ubuntu, flavor: puc-lua, flags: "--debug --prefer-lua" },
          ]
        test: [functionaltest, oldtest]
        exclude:
          - test: oldtest
            build: { runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.build.runner }}
    timeout-minutes: 45
    env:
      # The setup action adds this to PATH for neovim-ruby-host.
      BIN_DIR: ${{ github.workspace }}/.deps/bin
      # Install and load Ruby gems from the dependency cache.
      GEM_HOME: ${{ github.workspace }}/.deps/ruby
      NVIM_TEST_INTEG: ${{ matrix.build.flavor == 'release' && '1' || '0' }}
      # Add cached provider dependencies to Perl's module search path.
      PERL5LIB: ${{ github.workspace }}/.deps/perl5/lib/perl5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          install_flags: "--test"

      - name: Create log dir
        run: mkdir -p "$LOG_DIR"

      - name: Set up interpreter packages
        run: |
          echo "Install neovim RubyGem."
          gem install --no-document --bindir "$BIN_DIR" --conservative --pre neovim

          cpanm -n -L .deps/perl5 --skip-satisfied Neovim::Ext || cat "$HOME/.cpanm/build.log"
          perl -W -e 'use Neovim::Ext; print $Neovim::Ext::VERSION'

      - name: List runtime files
        run: git -C runtime ls-files -z '*.vim' '*.ps' '*.dict' '*.py' '*.tutor' '*.awk' '*.sh' '*.bat' > "$RUNNER_TEMP/runtime-files"

      - name: Remove .git directory
        if: ${{ matrix.build.os == 'ubuntu' }}
        run: rm -rf -- .git

      - name: Build
        env:
          BUILD_FLAGS: ${{ matrix.build.flags }}
        run: cargo xtask build $BUILD_FLAGS

      - if: ${{ matrix.test == 'functionaltest' && matrix.build.flavor != 'puc-lua' }}
        name: unittest
        timeout-minutes: 10
        env:
          BUILD_FLAGS: ${{ matrix.build.flags }}
        run: cargo xtask unittest $BUILD_FLAGS

      - if: ${{ matrix.test == 'functionaltest' }}
        name: functionaltest
        timeout-minutes: 20
        env:
          BUILD_FLAGS: ${{ matrix.build.flags }}
          TEST_TIMEOUT: 600
        run: cargo xtask functionaltest $BUILD_FLAGS

      - if: ${{ matrix.test == 'oldtest' }}
        name: oldtest
        timeout-minutes: 20
        env:
          BUILD_FLAGS: ${{ matrix.build.flags }}
        run: cargo xtask oldtest $BUILD_FLAGS

      - name: Install
        env:
          BUILD_FLAGS: ${{ matrix.build.flags }}
        run: |
          cargo xtask install $BUILD_FLAGS --prefix "$INSTALL_PREFIX"
          "$INSTALL_PREFIX/bin/nvim" -V1 --version
          if ! "$INSTALL_PREFIX/bin/nvim" -u NONE -e -c ':help' -c ':qall'; then
            echo "Running ':help' in the installed nvim failed."
            echo "Maybe the helptags have not been generated properly."
            echo 'Failed running :help'
            exit 1
          fi

          # Check that all runtime files were installed
          while IFS= read -r -d '' file; do
            if ! test -e "$INSTALL_PREFIX/share/nvim/runtime/$file"; then
              printf "It appears that %s is not installed." "$file"
              exit 1
            fi
          done < "$RUNNER_TEMP/runtime-files"

          # Check that generated syntax file has function names, #5060.
          genvimsynf=syntax/vim/generated.vim
          gpat='syn keyword vimFuncName .*eval'
          if ! grep -q "$gpat" "$INSTALL_PREFIX/share/nvim/runtime/$genvimsynf"; then
            echo "It appears that $genvimsynf does not contain $gpat."
            exit 1
          fi

      - if: '!cancelled()'
        name: Show logs
        run: |
          files=$(find "$LOG_DIR" -type f 2>/dev/null || true)
          if [ -n "$files" ]; then
            cat $files
          fi

  windows:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    name: windows release ${{ matrix.test }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test: [functionaltest, oldtest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build
        run: cargo xtask build --release

      - name: Install test deps
        run: |
          $PSNativeCommandArgumentPassing = 'Legacy'

          & target\nvim-build\bin\nvim.exe "--version"

          # Ensure that the "win32" feature is set.
          & target\nvim-build\bin\nvim.exe -u NONE --headless -c 'exe !has(\"win32\").\"cq\"'

          python -m pip install pynvim
          python -c "import pynvim; print(str(pynvim))"

          node --version
          npm.cmd --version

          npm.cmd install -g neovim
          Get-Command -CommandType Application neovim-node-host.cmd
          npm.cmd link neovim

      - if: ${{ matrix.test == 'functionaltest' }}
        name: unittest
        timeout-minutes: 10
        run: cargo xtask unittest --release

      - if: ${{ matrix.test == 'functionaltest' }}
        name: functionaltest
        timeout-minutes: 20
        env:
          TEST_TIMEOUT: 600
        run: |
          $ErrorActionPreference = 'Continue'
          $sleepProc = Start-Process -PassThru -WindowStyle Hidden (Get-Command sleep.exe).Source infinity
          try {
            cargo xtask functionaltest --release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            if ($sleepProc) { Stop-Process -Id $sleepProc.Id -Force -ErrorAction SilentlyContinue }
          }

      - if: ${{ matrix.test == 'oldtest' }}
        name: oldtest
        run: cargo xtask oldtest --release
