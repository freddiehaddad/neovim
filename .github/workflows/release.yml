name: release
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: false
        default: nightly
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: read

# Build on the oldest supported images, so we have broader compatibility
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      appimage_tag: ${{ steps.build.outputs.appimage_tag }}
    steps:
      - if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != 'nightly')
        run: echo 'appimage_tag=latest' >> $GITHUB_OUTPUT
        id: build_release
      - if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name == 'nightly'
        run: echo 'appimage_tag=nightly' >> $GITHUB_OUTPUT
        id: build_nightly
      - name: Export build information
        id: build
        run: |
          printf "appimage_tag=${{ steps.build_release.outputs.appimage_tag || steps.build_nightly.outputs.appimage_tag }}\n" >> $GITHUB_OUTPUT

  linux:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: sudo apt-get install -y zsync

      - name: Build release archive and AppImage
        env:
          APPIMAGE_TAG: ${{ needs.setup.outputs.appimage_tag }}
        run: cargo xtask dist

      - uses: actions/upload-artifact@v7
        with:
          name: nvim-appimage-${{ matrix.arch }}
          path: |
            target/release/nvim-linux-${{ matrix.arch }}.appimage
            target/release/nvim-linux-${{ matrix.arch }}.appimage.zsync
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: nvim-linux-${{ matrix.arch }}
          path: |
            target/release/nvim-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1

      - name: Export version
        id: build
        run: |
          printf 'version<<END\n' >> $GITHUB_OUTPUT
          ./target/release/nvim --version | head -n 3 >> $GITHUB_OUTPUT
          printf 'END\n' >> $GITHUB_OUTPUT

  macos:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        runner: [ macos-15-intel, macos-15 ]
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: 11.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build release archive
        run: cargo xtask dist

      - uses: actions/upload-artifact@v7
        with:
          name: nvim-macos-${{ matrix.arch }}
          path: target/release/nvim-macos-${{ matrix.arch }}.tar.gz
          retention-days: 1

  windows:
    needs: setup
    strategy:
      matrix:
        include:
          - runner: windows-2022
            arch: x86_64
            archive_name: nvim-win64
          - runner: windows-11-arm
            arch: arm64
            archive_name: nvim-win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build release archive and MSI
        shell: pwsh
        run: cargo xtask dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvim-win-${{ matrix.arch }}
          path: |
            target/release/${{ matrix.archive_name }}.zip
            target/release/${{ matrix.archive_name }}.msi
          retention-days: 1

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      # Must perform checkout first, since it deletes the target directory
      # before running, and would therefore delete the downloaded artifacts
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8

      - if: github.event_name == 'workflow_dispatch'
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - if: github.event_name == 'push'
        run: |
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - if: env.TAG_NAME == 'nightly'
        run: |
          (echo 'SUBJECT=Nvim development (prerelease) build';
           echo 'PRERELEASE=--prerelease') >> $GITHUB_ENV
          gh release delete nightly --yes || true
          git push https://${GITHUB_ACTOR}:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY} :nightly || true

      - if: env.TAG_NAME != 'nightly'
        run: |
          (echo 'SUBJECT=Nvim release build';
           echo 'PRERELEASE=') >> $GITHUB_ENV
          gh release delete stable --yes || true
          git push https://${GITHUB_ACTOR}:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY} :stable || true

      - name: Publish release
        env:
          NVIM_VERSION: ${{ needs.linux.outputs.version }}
          NVIM_COMMIT: ${{ github.sha }}
          DEBUG: api
        run: |
          cat <<EOF > "$RUNNER_TEMP/notes.md"
          \`\`\`
          ${NVIM_VERSION}
          \`\`\`

          ## Release notes

          - [Changelog](https://github.com/freddiehaddad/neovim/commit/${NVIM_COMMIT}) (fixes + features)
          - [News](./runtime/doc/news.txt) (\`:help news\` in Nvim)

          ## Install

          ### Windows

          #### Zip

          1. Download **nvim-win64.zip** (or **nvim-win-arm64.zip** for ARM)
          2. Extract the zip
          3. Run \`bin\\nvim.exe\` in your terminal

          #### MSI

          1. Download **nvim-win64.msi** (or **nvim-win-arm64.msi** for ARM)
          2. Run the MSI
          3. Run \`nvim.exe\` in your terminal

          Note: On Windows "Server" you may need to [install \`vcruntime*.dll\`](https://neovim.io/doc/install/#windows).

          ### macOS (x86_64)

          1. Download **nvim-macos-x86_64.tar.gz**
          2. Run \`xattr -c ./nvim-macos-x86_64.tar.gz\` (to avoid "unknown developer" warning)
          3. Extract: \`tar xzvf nvim-macos-x86_64.tar.gz\`
          4. Run \`./nvim-macos-x86_64/bin/nvim\`

          ### macOS (arm64)

          1. Download **nvim-macos-arm64.tar.gz**
          2. Run \`xattr -c ./nvim-macos-arm64.tar.gz\` (to avoid "unknown developer" warning)
          3. Extract: \`tar xzvf nvim-macos-arm64.tar.gz\`
          4. Run \`./nvim-macos-arm64/bin/nvim\`

          ### Linux (x86_64)

          If your system does not have the required glibc version, try the (unsupported) [builds for older glibc](https://github.com/neovim/neovim-releases).

          #### AppImage

          1. Download **nvim-linux-x86_64.appimage**
          2. Run \`chmod u+x nvim-linux-x86_64.appimage && ./nvim-linux-x86_64.appimage\`
             - If your system does not have FUSE you can [extract the appimage](https://github.com/AppImage/AppImageKit/wiki/FUSE#type-2-appimage):
               \`\`\`bash
               ./nvim-linux-x86_64.appimage --appimage-extract
               ./squashfs-root/usr/bin/nvim
               \`\`\`

          #### Tarball

          1. Download **nvim-linux-x86_64.tar.gz**
          2. Extract: \`tar xzvf nvim-linux-x86_64.tar.gz\`
          3. Run \`./nvim-linux-x86_64/bin/nvim\`

          ### Linux (arm64)

          #### AppImage

          1. Download **nvim-linux-arm64.appimage**
          2. Run \`chmod u+x nvim-linux-arm64.appimage && ./nvim-linux-arm64.appimage\`
             - If your system does not have FUSE you can [extract the appimage](https://github.com/AppImage/AppImageKit/wiki/FUSE#type-2-appimage):
               \`\`\`bash
               ./nvim-linux-arm64.appimage --appimage-extract
               ./squashfs-root/usr/bin/nvim
               \`\`\`

          #### Tarball

          1. Download **nvim-linux-arm64.tar.gz**
          2. Extract: \`tar xzvf nvim-linux-arm64.tar.gz\`
          3. Run \`./nvim-linux-arm64/bin/nvim\`

          ### Other

          - Install by [package manager](https://github.com/freddiehaddad/neovim/blob/master/INSTALL.md#install-from-package)
          EOF
          if [ "$TAG_NAME" != "nightly" ]; then
            gh release create stable $PRERELEASE --notes-file "$RUNNER_TEMP/notes.md" --title "$SUBJECT" --target $GITHUB_SHA nvim-macos-x86_64/* nvim-macos-arm64/* nvim-linux-x86_64/* nvim-linux-arm64/* nvim-appimage-x86_64/* nvim-appimage-arm64/* nvim-win-x86_64/* nvim-win-arm64/*
          fi
          gh release create $TAG_NAME $PRERELEASE --notes-file "$RUNNER_TEMP/notes.md" --title "$SUBJECT" --target $GITHUB_SHA nvim-macos-x86_64/* nvim-macos-arm64/* nvim-linux-x86_64/* nvim-linux-arm64/* nvim-appimage-x86_64/* nvim-appimage-arm64/* nvim-win-x86_64/* nvim-win-arm64/*
