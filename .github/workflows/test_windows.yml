name: windows
on:
  workflow_call:
    inputs:
      build_flags:
        type: string
      functionaltest_timeout:
        default: 20
        type: number
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test: [functional, old]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build
        run: cargo xtask build --release

      - name: Install test deps
        run: |
          $PSNativeCommandArgumentPassing = 'Legacy'

          & target\nvim-build\bin\nvim.exe "--version"

          # Ensure that the "win32" feature is set.
          & target\nvim-build\bin\nvim.exe -u NONE --headless -c 'exe !has(\"win32\").\"cq\"'

          python -m pip install pynvim
          # Sanity check
          python -c "import pynvim; print(str(pynvim))"

          node --version
          npm.cmd --version

          npm.cmd install -g neovim
          Get-Command -CommandType Application neovim-node-host.cmd
          npm.cmd link neovim

      - if: ${{ matrix.test == 'functional' }}
        name: functionaltest
        timeout-minutes: ${{ inputs.functionaltest_timeout }}
        env:
          TEST_TIMEOUT: 600
        run: |
          $ErrorActionPreference = 'Continue'
          # Keep an MSYS process (Git's usr/bin) alive, so the MSYS runtime initializes its shared
          # state only once. Else a test that kills an MSYS process during that init (CTRL-C) can
          # make the next one stall 15s and die: "fatal error - add_item (...) failed, errno 1".
          Start-Process -WindowStyle Hidden (Get-Command sleep.exe).Source infinity
          cargo xtask functionaltest --release

      - if: ${{ matrix.test == 'old' }}
        name: oldtest
        run: cargo xtask oldtest --release
