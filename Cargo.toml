[package]
name = "nvim-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "nvim_rs"
path = "src/nvim/lib.rs"
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "nvim"
path = "src/nvim/main.rs"
test = false

[[bin]]
name = "tee"
path = "src/tee/main.rs"

[[bin]]
name = "xxd"
path = "src/xxd/main.rs"

[[bin]]
name = "printargs-test"
path = "test/functional/fixtures/printargs-test.rs"

[[bin]]
name = "printenv-test"
path = "test/functional/fixtures/printenv-test.rs"

[[bin]]
name = "shell-test"
path = "test/functional/fixtures/shell-test.rs"

[[bin]]
name = "streams-test"
path = "test/functional/fixtures/streams-test.rs"

[[bin]]
name = "tty-test"
path = "test/functional/fixtures/tty-test.rs"

[features]
vendor-bit = []

[profile.dev]
codegen-units = 256

[profile.release]
codegen-units = 256
