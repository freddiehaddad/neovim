[workspace]
members = [".", "src/xtask"]
default-members = ["."]

[package]
name = "neovim"
version = "0.13.0-dev"
edition = "2024"
rust-version = "1.88"

[package.metadata.nvim]
api_level = 15

[lib]
name = "neovim"
path = "src/nvim/lib.rs"
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "nvim"
path = "src/nvim/main.rs"
test = false

[[bin]]
name = "tee"
path = "src/tee/main.rs"

[[bin]]
name = "xxd"
path = "src/xxd/main.rs"

[[bin]]
name = "printargs-test"
path = "test/functional/fixtures/printargs-test.rs"

[[bin]]
name = "printenv-test"
path = "test/functional/fixtures/printenv-test.rs"

[[bin]]
name = "shell-test"
path = "test/functional/fixtures/shell-test.rs"

[[bin]]
name = "streams-test"
path = "test/functional/fixtures/streams-test.rs"

[[bin]]
name = "tty-test"
path = "test/functional/fixtures/tty-test.rs"

[features]
vendor-bit = []

[profile.dev]
codegen-units = 256

[profile.release]
lto = "thin"

[lints.clippy]
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
enum_variant_names = "allow"
missing_safety_doc = "allow"
module_inception = "allow"
too_many_arguments = "allow"
upper_case_acronyms = "allow"

