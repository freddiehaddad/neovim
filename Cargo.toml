[package]
name = "nvim-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "nvim_rs"
path = "src/nvim/lib.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "tee"
path = "src/tee/main.rs"

[[bin]]
name = "xxd"
path = "src/xxd/main.rs"

[features]
vendor-bit = []

[profile.dev]
codegen-units = 256

[profile.release]
codegen-units = 256
